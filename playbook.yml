---
- name: Configure RPi boards
  hosts: all

  roles:
    - role: packages
    - role: journald
    - role: zram
    - role: network
    - role: dns_resolver
    - role: wireguard
    - role: healthchecks

- name: Configure RPi3
  hosts: rpi3

  roles:
    - role: node_exporter
    - role: vector

- name: Configure RPi4
  hosts: rpi4

  vars:
    k3s_version: v1.36.3+k3s1

  roles:
    - role: k3s
