---
- name: Configure RPI4
  hosts: all

  vars:
    # List of channels with latest versions is available at
    # <https://update.k3s.io/v1-release/channels>.
    k3s_version: v1.36.3+k3s1

  roles:
    - role: packages
      tags: packages
    - role: journald
      tags: journald
    - role: zram
      tags: zram
      when: inventory_hostname in groups['rpi4']
    - role: network
      tags: network
    - role: wireless
      tags: wireless
    - role: dns_resolver
      tags: dns_resolver
    - role: wireguard
      tags: wireguard
    - role: k3s
      tags: k3s
