---
#
# Setup and configure wireless (WiFi) networking.
#
# Uses ifupdown's wpasupplicant integration (wpa-ssid/wpa-psk directives in
# /etc/network/interfaces.d/wlan0) to bring up wlan0 automatically at boot,
# following <https://wiki.debian.org/WiFi/HowToUse>. ifupdown is installed
# explicitly below since some hosts' base image manages networking via
# systemd-networkd instead and don't have it; installing it only adds a
# wlan0 stanza to /etc/network/interfaces.d, so it never touches other
# interfaces already managed by systemd-networkd (e.g. eth0).
#
# wireless_ssid and wireless_psk are expected to come from an
# ansible-vault-encrypted group_vars file (see README.md) and must never be
# stored unencrypted in this repository. wireless_enabled defaults to
# false here as a safe fallback; the committed group_vars/rpi4/wireless.yml
# for this repo's actual host sets it to true, since WiFi is this board's
# primary network connection.
#
# The interface is deliberately never restarted here: if this host is
# currently reached over wlan0 itself, bouncing it could drop the very SSH
# session applying the change. Reboot, or run `ifup wlan0` manually, to
# apply a changed configuration.
#
# firmware-brcm80211 and wireless-regdb aren't on every base image.
# Missing wireless-regdb can silently block wpa_supplicant.
#

- name: Check wireless SSID/PSK/address/gateway are set when enabled.
  delegate_to: localhost
  ansible.builtin.assert:
    that:
      - wireless_ssid | length > 0
      - wireless_psk | length > 0
      - wireless_address | length > 0
      - wireless_gateway | length > 0
    fail_msg: >
      wireless_enabled is true but wireless_ssid, wireless_psk,
      wireless_address and/or wireless_gateway are empty. Populate the
      SSID/PSK via an ansible-vault-encrypted group_vars file.
    quiet: true
  when: wireless_enabled
- name: Update apt cache if needed.
  become: true
  ansible.builtin.apt:
    cache_valid_time: 3600
    update_cache: true
  when: wireless_enabled
- name: Install ifupdown if needed.
  become: true
  ansible.builtin.apt:
    name: ifupdown
    state: present
  when: wireless_enabled
- name: Install wpasupplicant if needed.
  become: true
  ansible.builtin.apt:
    name: wpasupplicant
    state: present
  when: wireless_enabled
- name: Install firmware-brcm80211 if needed.
  become: true
  ansible.builtin.apt:
    name: firmware-brcm80211
    state: present
  when: wireless_enabled
- name: Install wireless-regdb if needed.
  become: true
  ansible.builtin.apt:
    name: wireless-regdb
    state: present
  when: wireless_enabled
- name: Ensure /etc/network/interfaces.d exists.
  become: true
  ansible.builtin.file:
    path: /etc/network/interfaces.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: wireless_enabled
- name: Populate wireless interface configuration.
  become: true
  ansible.builtin.template:
    src: wlan0.j2
    dest: /etc/network/interfaces.d/wlan0
    owner: root
    group: root
    mode: '0600'
  no_log: true
  when: wireless_enabled
