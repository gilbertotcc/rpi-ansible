---
#
# Install needed packages and update all packages to latest version.
#
# Uses apt and update the apt cache and keep it for 3600 seconds (to possibly
# save some bandwidth and time), clean up old package files and unused
# dependencies, and update all packages to their latest version.
#

- name: Update apt cache if needed.
  become: true
  ansible.builtin.apt:
    cache_valid_time: 3600
    update_cache: true
- name: Autoclean apt cache.
  become: true
  ansible.builtin.apt:
    autoclean: true
  when: packages_update
- name: Autoremove unused packages.
  become: true
  ansible.builtin.apt:
    autoremove: true
  when: packages_update
- name: Update all packages to latest version.
  become: true
  ansible.builtin.apt:
    name: "*"
    state: latest
    only_upgrade: true
  when: packages_update
- name: Install needed packages.
  become: true
  ansible.builtin.apt:
    name: "{{ packages_needed_packages }}"
    state: present
